<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="A8.css">
</head>
<body>
    <div class="container">

        <div class="inner">

            <header><h1>장바구니</h1></header>
            <!-- 타이틀 -->

            <div class="object_container">

                <div class="box">
                    <img src="images/tshirt.jpg" alt="@">
                    <h4>WorldSkills 공식 티셔츠</h4>
                    <div class="option">
                        <p>색상: 네이비</p>
                        <p>사이즈: L</p>
                    </div>

                    <div class="amount">
                        <button>-</button>
                        <p>2</p>
                        <button>+</button>
                    </div>

                    <div class="amount2">
                        <p>25.000원</p>
                        <button>×</button>
                    </div>
                </div>

                <div class="box">
                    <img src="images/book.jpg" alt="@">
                    <h4>기능경기 가이드북</h4>
                    <div class="option">
                        <p>종류: 웹디자인</p>
                        <p>2026년 최신판</p>
                    </div>

                    <div class="amount">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>

                    <div class="amount2">
                        <p>15,000원</p>
                        <button>×</button>
                    </div>
                </div>

                <div class="box">
                    <img src="images/laptop-case.jpg" alt="@">
                    <h4>WorldSkills 노트북 파우치</h4>
                    <div class="option">
                        <p>색상: 블랙</p>
                        <p>15인치 호환</p>
                    </div>

                    <div class="amount">
                        <button>-</button>
                        <p>1</p>
                        <button>+</button>
                    </div>

                    <div class="amount2">
                        <p>35,000원</p>
                        <button>×</button>
                    </div>
                </div>

            </div>
            <!-- 상품 -->

            <div class="price">

                <div class="price_top">
                    <p>상품금액</p>
                    <p>75,000원</p>
                </div>
                <div class="price_top">
                    <p>배송비</p>
                    <p>3,000원</p>
                </div>
                <div class="price_bot">
                    <p>총 결제금액</p>
                    <p>78,000원</p>
                </div>

                <div class=""></div>
            </div>
            <!-- 총가격 -->

            <div class="payment">
                <button>쇼핑 계속하기</button>
                <button>주문하기</button>
            </div>
            <!-- 버튼 -->
        </div>
        
    </div>
</body>
</html>
