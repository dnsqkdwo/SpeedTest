<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A13 - 모달 팝업</title>
    <link rel="stylesheet" href="A13.css">
</head>
<body>
    <div class="wrap">
        <input type="checkbox" id="toggle">

        <label for="toggle" class="openButton">로그인</label>

        <div class="modal">
            <label for="toggle" class="closeButton">닫기</label>
            <h1>계정 로그인</h1>
            <p>안전한 서비스를 위해 로그인이 필요합니다.</p>
            <p>계속하려면 아래에 등록된 이메일과 비밀번호를 입력해주세요.</p>
            <span>&#8681;</span>
            <h3>로그인 계속</h3>
        </div>
    </div>
</body>
</html>
