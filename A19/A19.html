<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A19 - 카드 스택 애니메이션</title>
    <link rel="stylesheet" href="A19.css">
</head>
<body>
    <input type="radio" name="card" id="r1" checked>
    <input type="radio" name="card" id="r2">
    <input type="radio" name="card" id="r3">

    <div class="stack">
        <div class="card c1">Card 1</div>
        <div class="card c2">Card 2</div>
        <div class="card c3">Card 3</div>
    </div>

    <div class="btn b1"><label for="r3">이전</label><label for="r2">다음</label></div>
    <div class="btn b2"><label for="r1">이전</label><label for="r3">다음</label></div>
    <div class="btn b3"><label for="r2">이전</label><label for="r1">다음</label></div>
</body>
</html>
